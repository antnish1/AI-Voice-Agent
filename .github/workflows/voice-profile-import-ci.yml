name: Verify Sarvam Voice Profile Import
on:
  pull_request:
    paths:
      - "src/app/api/sarvam/voice-deployments/**"
      - "src/app/(portal)/settings/voice-profiles/**"
      - ".github/workflows/voice-profile-import-ci.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Run tests
        run: npm test
      - name: Next.js build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
